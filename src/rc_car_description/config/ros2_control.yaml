controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

ackermann_steering_controller:
  ros__parameters:

    front_wheels_names: ["front_right_steer_joint", "front_left_steer_joint"]
    rear_wheels_names: ["rear_right_wheel_joint", "rear_left_wheel_joint"]   

    front_wheels_state_names: ["front_right_steer_joint", "front_left_steer_joint"]
    rear_wheels_state_names: ["rear_right_wheel_joint", "rear_left_wheel_joint"]

    wheelbase: 0.277
    front_wheel_track: 0.28
    rear_wheel_track: 0.28
    front_wheels_radius: 0.055 
    rear_wheels_radius: 0.055 

    front_steering: true

    # Limits
    max_steer: 0.75
    min_steer: -0.75
    
    # Odometry & Frames
    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: false
    
    # Stability
    use_stamped_vel: false
    publish_rate: 100.0
    open_loop: false
    reference_timeout: 0.5

    # The robot uses position-controlled front steering joints and velocity-controlled
    # rear drive joints. Use the velocity state feedback path for this mixed setup.
    position_feedback: false

    publish_limited_velocity: true

    gains:
      front_left_steer_joint:
        p: 500.0
        i: 10.0
        d: 50.0
      front_right_steer_joint:
        p: 500.0
        i: 10.0
        d: 50.0
      rear_left_wheel_joint:
        p: 50.0
        i: 1.0
        d: 5.0
      rear_right_wheel_joint:
        p: 50.0
        i: 1.0
        d: 5.0

    linear:
      x:
        has_velocity_limits: true
        max_velocity: 3.0
        min_velocity: -3.0
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 1.0


    # joints:
    #   - front_left_steer_joint
    #   - front_right_steer_joint
    #   - front_left_wheel_joint
    #   - front_right_wheel_joint
    #   - rear_left_wheel_joint
    #   - rear_right_wheel_joint
    # command_interfaces:
    #   - position
    #   - velocity
    # state_interfaces:
    #   - position
    #   - velocity

joint_state_broadcaster:
  ros__parameters:
    joints:
      - front_left_steer_joint
      - front_right_steer_joint
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
